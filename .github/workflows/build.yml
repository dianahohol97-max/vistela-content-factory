name: build-content

on:
  schedule:
    # Daily 06:00 UTC — an iPad review every day, a personalise-with-me every
    # other day. Pins and carousels still build only on Mon+Thu (see build.py).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      hook:
        description: "Force this exact hook on the phone-reveal reel (leave empty for rotation)"
        required: false
        default: ""
      product:
        description: "Only pair products whose filename contains this text (e.g. 'Save the Date')"
        required: false
        default: ""
      rubric:
        description: "Force the second reel's rubric (personalize / phone_review / product_tour / ai_review)"
        required: false
        default: ""
      clip:
        description: "Only use review clips whose filename contains this text (e.g. '17 56 10')"
        required: false
        default: ""
      category:
        description: "Force the product type on a review reel (save_the_date / wedding_website / invitation)"
        required: false
        default: ""

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch brand fonts
        run: |
          mkdir -p fonts
          curl -sSLg -o fonts/CormorantGaramond.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf"
          curl -sSL  -o fonts/ArchivoBlack.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/archivoblack/ArchivoBlack-Regular.ttf"

      - name: Ensure ffmpeg (for reels)
        # `A || B && C` groups as `(A || B) && C`, so the install ran on every
        # build even though the runner image already ships ffmpeg — and once apt
        # stalled it hung the job for an hour. Guard it properly and keep apt
        # non-interactive so it can never wait on a prompt.
        run: |
          if ffmpeg -version >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
        timeout-minutes: 5

      - name: Sync input clips from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python sync_dropbox.py

      - name: Generate content + queue
        env:
          FORCE_HOOK: ${{ inputs.hook }}
          FORCE_PRODUCT: ${{ inputs.product }}
          FORCE_RUBRIC: ${{ inputs.rubric }}
          FORCE_CLIP: ${{ inputs.clip }}
          FORCE_CATEGORY: ${{ inputs.category }}
        run: python build.py

      - name: Commit generated media & queue
        run: |
          git config user.name "vistela-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output queue rotation_log.json sync_report.json input/site-photos
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh pins, carousels & queue [skip ci]"
            # a push to main while the build was running would otherwise reject
            # this one and throw away the generated media
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main
            done
            git push
          fi
